name: keepalive

# GitHub 会在公开仓库 60 天无活动时自动禁用定时工作流。
# 主工作流改为只发布 dist 分支、不再提交 main，因此用一个每月一次的小提交保持仓库活跃。
on:
  schedule:
    - cron: '0 0 1 * *' # 每月 1 日 UTC 0 点
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch heartbeat
        run: |
          mkdir -p state
          date -u '+%Y-%m-%dT%H:%M:%SZ' > state/heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/heartbeat.txt
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: keepalive $(date -u '+%Y-%m-%d')"
            git push
          fi
