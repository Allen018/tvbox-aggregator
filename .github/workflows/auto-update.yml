name: tvbox-aggregator

on:
  schedule:
    # 每日一次（UTC 0 点，北京时间早 8 点）
    - cron: '0 0 * * *'
  workflow_dispatch:

# 同一工作流禁止重叠运行，避免两个任务同时强推 dist 分支
concurrency:
  group: tvbox-aggregator-dist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    name: 聚合测速与发布
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 恢复上轮发现源池
        run: |
          git fetch origin dist --quiet || true
          git show origin/dist:dist/discovered.yaml > config/discovered.yaml 2>/dev/null || true

      - name: 构建
        run: go build -trimpath -ldflags="-s -w" -o tvbox-aggregator .

      - name: 运行聚合测速与自动发现
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TVBOX_JAR_BASE_URL: ${{ vars.TVBOX_JAR_BASE_URL }}
        run: ./tvbox-aggregator

      # 产物只发布到独立的 dist 分支，不碰 main。
      # main 永远只包含代码，本地与远端不会再分叉。
      - name: 发布快照到 dist 分支
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SNAPSHOT="$(mktemp -d)"
          git worktree add --detach "$SNAPSHOT" >/dev/null
          cd "$SNAPSHOT"

          # 用孤儿分支做单快照提交，dist 分支永远只有一次提交
          git checkout --orphan site
          git rm -rf . >/dev/null 2>&1 || true

          mkdir -p dist
          cp -r "$GITHUB_WORKSPACE/dist/." dist/
          cp "$GITHUB_WORKSPACE/config/discovered.yaml" dist/discovered.yaml

          git add -A
          git commit -m "dist snapshot: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" --allow-empty
          git push --force origin HEAD:dist

          echo "已发布 dist 分支快照"
