name: tvbox-aggregator

on:
  schedule:
    # 每日一次（UTC 0 点，对应北京时间早 8 点）；兼顾时效与 Actions 用量
    - cron: '0 0 * * *'
  workflow_dispatch:

# 同一工作流禁止重叠运行，避免上一轮未结束时下一轮又启动
concurrency:
  group: tvbox-aggregator-dist
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  aggregate:
    name: 聚合测速与分发
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 构建
        run: go build -trimpath -ldflags="-s -w" -o tvbox-aggregator .

      - name: 运行聚合测速与自动发现
        env:
          # GitHub 代码搜索通道认证（官方 Search API，Actions 内置 token 即可）
          GITHUB_TOKEN: ${{ github.token }}
          # 本地托管 jar 的 CF 基础地址，未配置则不重写 spider/jar（可在仓库 Settings -> Variables 配置）
          TVBOX_JAR_BASE_URL: ${{ vars.TVBOX_JAR_BASE_URL }}
        run: ./tvbox-aggregator

      - name: 提交产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ config/discovered.yaml
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            if git rev-parse --verify HEAD >/dev/null 2>&1; then
              # 仅保留最新一次快照，仓库体积永久保持在几 MB 以内
              git commit --amend --no-edit --date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              git push --force-with-lease origin HEAD
            else
              git commit -m "chore: 初始化聚合产物"
              git push origin HEAD
            fi
          fi
