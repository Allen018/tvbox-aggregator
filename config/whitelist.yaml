# 国内专属保底源白名单
#
# 命中白名单的源免测速，仅做存活探测，自动标注 [国内直连] 并置顶于订阅前列。
# 海外返回 403/503 属预期内（国内可直连），不计为失效；网络层失败才计为疑似失效。
#
# 说明：白名单面向**单个源**（采集站 API 或订阅提取出的站点地址），
# 不适用于订阅式源（订阅是站点组，其内部站点通过订阅抓取自动入池）。
#
# 保底直连采集站：不依赖 spider JAR，客户端开箱即用。
# type: 1=JSON CMS（provide/vod），0=XML CMS（provide/vod/at/xml/）。
# 这些地址用于即使爬虫 JAR 全部失效时仍有线路；如已失效请直接删除对应条目。

whitelist:
  - name: "保底-360采集"
    url: "https://360zy.com/api.php/provide/vod"
    type: 1
    note: "原项目简洁版常用源，JSON CMS"

  - name: "保底-奶香采集"
