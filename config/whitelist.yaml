# 国内专属保底源白名单
#
# GitHub Actions 位于海外机房，部分优质国内采集站会对海外 IP 返回
# 403/503，导致测速失败被误杀。命中白名单的源：
#   - 免测速（不做 m3u8 测速与排序）；
#   - 仅做低成本存活探测（GET 首页/API）；
#   - 自动标注 [国内直连] 并置顶于 tvbox_full.json 与 tvbox_multi.json 前列。
#
# 探测口径：海外返回 403/503 属预期内（国内可直连），不计为失效；
# 网络层超时/解析失败才计为疑似失效，请结合 status.json 定期复核。

whitelist:
  - name: "索尼资源"
    url: "http://api.wujinren.cn/motif/api.php/provide/vod"
    note: "国内三网直连优质采集站"

  - name: "小米"
    url: "http://xiaomi.on/motif/api.php/provide/vod"
    note: "国内直连保底源"

