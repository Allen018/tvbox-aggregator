# TVBox 聚合源池配置
#
# top_n: 单一订阅版（tvbox.json）收录的源数量，默认 50；
#       白名单源置顶，爬虫站保底（按订阅组轮询交错保证来源多样性），
#       其余按测速评分降序填充剩余名额。
#
# type:
#   collect      - 采集站（苹果 CMS 兼容 API，可测速，参与排序）
#   spider       - 爬虫站（免测，订阅中保底保留，按延迟升序排列）
#   subscription - 订阅式源（抓取整站订阅配置，自动提取内部站点合并入池；
#                  组本身不输出，仅作为站点提取入口）
#
# local_jar: 爬虫站 spider 地址是否重写为本地托管（需 jar 已放入仓库 jar/ 目录；
#            订阅提取的第三方 jar 不重写，保持原地址）
#
# 说明：以下为实测可用的订阅式源（2026-11 验证），订阅源内部站点由维护者持续更新，
#       聚合器每轮自动抓取提取，失效订阅会自动在诊断中暴露（见 dist/status.json）。

top_n: 50

sources:
  # ---------- 订阅式源（主流生态，抓取配置提取站点） ----------
  - name: "老刘备"
    url: "http://raw.liucn.cc/box/m.json"
    type: subscription

  - name: "小马"
    url: "http://szyyds.cn/tv/x.json"
    type: subscription

  - name: "4K小盒子"
    url: "http://xhztv.top/4k.json"
    type: subscription

  - name: "小盒子单仓"
    url: "http://xhztv.top/xhz"
    type: subscription

  - name: "拾光多仓"
    url: "http://xmbjm.fh4u.org/dc.txt"
    type: subscription

  - name: "挺好分享多仓"
    url: "http://ztha.top/TVBox/GYCK.json"
    type: subscription

  - name: "挺好追剧"
    url: "https://ztha.top/TVBox/thdjk.json"
    type: subscription

  # ---------- 采集站（经典 provide/vod 格式，如找到可用地址可追加） ----------
  # - name: "示例采集站"
  #   url: "http://可用地址/motif/api.php/provide/vod"
  #   type: collect

  # ---------- 爬虫站（需真实 spider jar，可自由分发时启用） ----------
  # - name: "示例爬虫站"
  #   url: "https://真实站点.com"
  #   type: spider
  #   spider: "jar/spider.jar"
  #   local_jar: true
