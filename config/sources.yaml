# TVBox 聚合源池配置
#
# top_n: 单一订阅版（tvbox.json）收录的源数量，默认 15；
#       白名单源置顶后，其余按测速评分（带宽×0.7 + 响应×0.3）降序截取。
#
# type:
#   collect - 采集站（苹果 CMS 兼容 API，可测速，参与排序）
#   spider  - 爬虫站（播放地址需客户端侧 spider jar 解析，服务端无法测速，免测保留）
#
# headers: 可选，按站点自定义请求头（反爬校验，如 Referer/Cookie）
# skip: 可选，跳过测速（仍输出配置，适合暂时保留但不稳定的源）
#
# 说明：以下为示例源池，采集站域名变动频繁，请结合 dist/status.json 定期巡检更新。

top_n: 15

